name: Set up limessh build
description: Install the shared Java, Python, Gradle and Android SDK prerequisites
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Android SDK
      shell: bash
      run: |
        # GitHub-hosted Ubuntu runners ship the Android SDK pre-installed.
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        # Locate sdkmanager — may be under cmdline-tools/latest or tools.
        if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
          SDKMANAGER="$SDK/tools/bin/sdkmanager"
        else
          echo "::error::sdkmanager not found in $SDK. Install Android command-line tools."
          exit 1
        fi
        # Export paths for subsequent steps
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        # Accept all licences and install required packages
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        packages=$(python3 build-local.py --print-sdk-packages)
        mapfile -t required <<< "$packages"
        "$SDKMANAGER" --install "${required[@]}"
        # Verify prerequisites
        export ANDROID_HOME="$SDK"
        export ANDROID_SDK_ROOT="$SDK"
        python3 build-local.py --check
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
