name: Set up limessh build
description: Install the shared Java, Python, Gradle and Android SDK prerequisites
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Android SDK from pre-installed runner tools
      shell: bash
      run: |
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        export ANDROID_HOME="$SDK"
        export ANDROID_SDK_ROOT="$SDK"
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        packages=$(python3 build-local.py --print-sdk-packages)
        mapfile -t required <<< "$packages"
        sdkmanager --install "${required[@]}"
        python3 build-local.py --check
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
