name: Build APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checks and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Test local build helper
        run: python3 -m unittest discover -s tests -v
      - name: Check shell launcher
        run: shellcheck build.sh
      - name: Run checks and build debug and unsigned release
        run: bash build.sh --ci --release --no-daemon --max-workers 2
      - name: Verify debug APK signature
        shell: bash
        run: |
          packages=$(python3 build-local.py --print-sdk-packages)
          tools=$(printf '%s\n' "$packages" | sed -n 's/^build-tools;//p')
          "$ANDROID_HOME/build-tools/$tools/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: limessh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: limessh-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limessh-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
