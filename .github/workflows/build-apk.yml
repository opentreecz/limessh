name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Repackage signed LimeSSH APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android build-tools
        run: |
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
            "$sdkmanager" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Build and sign APK
        run: bash build.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: limessh-debug-apk
          path: build/limessh-debug.apk
          if-no-files-found: error
          retention-days: 30
