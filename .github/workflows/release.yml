name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "build-tools;34.0.0" "platform-tools"

      - name: Build and sign APK
        run: bash build.sh

      - name: Stage release asset
        id: stage
        shell: bash
        run: |
          assets="$RUNNER_TEMP/limessh-assets"
          mkdir -p "$assets"
          name="${GITHUB_REF_NAME#v}"
          cp build/limessh-debug.apk "$assets/limessh-${name}.apk"
          ( cd "$assets" && sha256sum -- *.apk > SHA256SUMS )
          echo "dir=$assets" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.stage.outputs.dir }}/"*.apk \
            "${{ steps.stage.outputs.dir }}/SHA256SUMS" \
            --title "LimeSSH $GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"
