name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check, build and publish tagged APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Validate tag and set APK version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf '%s\n' 'Expected a tag such as v0.1.0 or v0.1.0-alpha1.' >&2
            exit 1
          fi
          printf 'name=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test local build helper
        run: python3 -m unittest discover -s tests -v
      - name: Run checks and build versioned APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: bash build.sh --ci --release --no-daemon --max-workers 2 --version-name "$VERSION_NAME" --version-code "$GITHUB_RUN_NUMBER"
      - name: Stage APKs and optionally sign release
        id: assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          assets="$RUNNER_TEMP/limessh-release-assets"
          mkdir -p "$assets"
          cp app/build/outputs/apk/debug/app-debug.apk "$assets/limessh-${VERSION_NAME}-debug.apk"
          packages=$(python3 build-local.py --print-sdk-packages)
          tools=$(printf '%s\n' "$packages" | sed -n 's/^build-tools;//p')
          signer="$ANDROID_HOME/build-tools/$tools/apksigner"
          "$signer" verify "$assets/limessh-${VERSION_NAME}-debug.apk"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
            : "${KEY_ALIAS:?Missing KEY_ALIAS}"
            : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
            keystore="$RUNNER_TEMP/limessh-release.jks"
            trap 'rm -f "$keystore"' EXIT
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            "$signer" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$assets/limessh-${VERSION_NAME}-release-signed.apk" \
              app/build/outputs/apk/release/app-release-unsigned.apk
            "$signer" verify --verbose "$assets/limessh-${VERSION_NAME}-release-signed.apk"
            printf 'signed=true\n' >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$assets/limessh-${VERSION_NAME}-release-unsigned.apk"
            printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Create asset checksums
        working-directory: ${{ runner.temp }}/limessh-release-assets
        run: sha256sum -- *.apk > SHA256SUMS
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limessh-release-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNED: ${{ steps.assets.outputs.signed }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/limessh-release-notes.md"
          printf '%s\n' \
            'Requires Android 8.0 / API 26 or newer.' \
            'The debug APK is debug-signed and installable for development testing.' \
            'A release-unsigned APK must be signed before installation; a release-signed APK uses the configured publisher key.' \
            'Debug and publisher-signed builds use different certificates and cannot update each other in place.' \
            'SHA256SUMS contains checksums for the APK assets.' > "$notes"
          printf '\nPublisher signing configured: %s\n' "$RELEASE_SIGNED" >> "$notes"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/limessh-release-assets/"*.apk \
            "$RUNNER_TEMP/limessh-release-assets/SHA256SUMS" \
            --verify-tag --title "limessh $GITHUB_REF_NAME" \
            --generate-notes --notes-file "$notes" "${flags[@]}"
