name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licences and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :limessh:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        id: stage
        shell: bash
        run: |
          assets="$RUNNER_TEMP/limessh-assets"
          mkdir -p "$assets"
          name="${GITHUB_REF_NAME#v}"
          cp limessh/build/outputs/apk/debug/*.apk "$assets/limessh-${name}-debug.apk"
          ( cd "$assets" && sha256sum -- *.apk > SHA256SUMS )
          echo "dir=$assets" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.stage.outputs.dir }}/"*.apk \
            "${{ steps.stage.outputs.dir }}/SHA256SUMS" \
            --title "limessh $GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"
